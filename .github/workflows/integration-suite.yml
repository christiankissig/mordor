# One suite of test/test_integration.exe, called by the workflows that give
# a suite its own README badge: litmus-tests.yml and episodicity-tests.yml. A
# badge shows a workflow's status, so each such suite has a workflow. The rest of
# the integration tests run in ci.yml.
name: Integration suite
on:
  workflow_call:
    inputs:
      name:
        description: The suite's name in the run
        required: true
        type: string
      suite:
        description: The Alcotest suite to run, as test_integration.exe names it
        required: true
        type: string

jobs:
  suite:
    name: ${{ inputs.name }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
        ocaml-compiler:
          - 5.2.x
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true

      # setup-ocaml caches the compiler but not the project's dependencies, and
      # building z3 from source alone takes over ten minutes. This caches the
      # switch with them. ci.yml and integration-suite.yml share the cache, so
      # their "Install dependencies" steps must install the same packages. The
      # key rolls over weekly, so the dependencies do not stay frozen at the
      # versions of the first build.
      - name: Get cache week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache opam dependencies
        uses: actions/cache@v4
        with:
          path: _opam
          key: opam-deps-v1-${{ matrix.os }}-${{ matrix.ocaml-compiler }}-${{ steps.week.outputs.week }}-${{ hashFiles('*.opam') }}
          restore-keys: |
            opam-deps-v1-${{ matrix.os }}-${{ matrix.ocaml-compiler }}-${{ steps.week.outputs.week }}-
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev pkg-config
      
      - name: Install Z3
        run: |
          sudo apt-get install -y z3 libz3-dev
      
      - name: Pin package
        run: opam pin add . --no-action
      
      - name: Install dependencies
        run: |
          sudo apt-get install -y libev-dev
          # Pin z3: 4.16.0+ requires a C++20 <format> implementation (GCC 13+),
          # which ubuntu-22.04 (GCC 11) lacks. 4.15.2 is the last version that
          # builds on this runner and is what the project uses.
          opam install z3.4.15.2
          opam install . --deps-only --with-test
          opam install menhir ocamlformat.0.29.0 logs fmt

      - name: Fix Landmarks stubs library
        run: |
          opam exec -- bash -c '
            LANDMARKS_DIR=$(opam var lib)/landmarks
            echo "Landmarks directory: $LANDMARKS_DIR"
            
            if [ -d "$LANDMARKS_DIR" ]; then
              cd "$LANDMARKS_DIR"
              ls -la
              
              if [ -f "liblandmark_stubs.a" ]; then
                ar x liblandmark_stubs.a 
                ocamlmklib -o landmark_stubs *.o 
                ls -lh liblandmark_stubs.a dlllandmark_stubs.so 
                cp dlllandmark_stubs.so $(ocamlc -where)/stublibs/ 
                rm *.o
                echo "Successfully fixed landmarks stubs library"
              else
                echo "Warning: liblandmark_stubs.a not found in $LANDMARKS_DIR"
              fi
            else
              echo "Warning: Landmarks directory not found at $LANDMARKS_DIR"
            fi
          '
      
      - name: Build project
        run: opam exec -- dune build
      
      - name: Run ${{ inputs.name }}
        # hp-1.lit takes 200-300 s on CI runners; the test's default of 300 s
        # makes it flaky.
        env:
          MORDOR_EPISODICITY_TIMEOUT: "900"
        run: opam exec -- dune exec test/test_integration.exe -- test "${{ inputs.suite }}"
